name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates both clients from the committed chanx schema and fails if the output
      # differs from what is committed, so codegen changes cannot land unreviewed.
      - run: pnpm check:conformance

  layers:
    name: Layers and server on Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s
          --health-retries 15
      redis-2:
        image: redis:7
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6389
      REDIS_URL_2: redis://localhost:6390
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test packages/layers packages/server

  runtimes:
    name: Server on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      # The smoke script runs the built packages, as they are published.
      - run: pnpm build
      - run: pnpm --filter @chanx-js/server smoke:${{ matrix.runtime }}

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypeDoc warnings and dead links fail this, so a pull request cannot break the site.
      - run: pnpm docs:build
