name: Publish

# A release is a push of versioned packages: `pnpm version-packages` turns the pending
# changesets into version bumps and changelogs, and once that commit reaches main, this
# publishes every package version not on npm yet, then tags and releases it on GitHub.
on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The environment npm's trusted publishers name.
    environment: deploy
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pnpm publishes through it.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Pending changesets mean the packages are not versioned yet: nothing to publish.
      - id: pending
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          fi
      # With no changesets pending, the action only publishes: `pnpm release` checks,
      # builds and runs `changeset publish`, which skips versions already on npm. A new
      # package's first version is published by hand: trusted publishing needs it to exist.
      - id: changesets
        if: steps.pending.outputs.changesets != 'true'
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
