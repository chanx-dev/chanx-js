# Redis for the layer tests: two servers so sharding is exercised.
#   docker compose up -d
#   REDIS_URL=redis://localhost:6389 REDIS_URL_2=redis://localhost:6390 pnpm test packages/layers
services:
  redis:
    image: redis:7
    ports:
      - '6389:6379'
  redis-2:
    image: redis:7
    ports:
      - '6390:6379'

  # Redis Sentinel, only with its profile: a master, a replica and one sentinel, announced
  # by hostname so a test can map them to the published ports.
  #   docker compose --profile sentinel up -d
  #   REDIS_SENTINEL=localhost:26379 pnpm test --project layers
  sentinel-master:
    image: redis:7
    profiles: [sentinel]
    command: redis-server --replica-announce-ip sentinel-master
    ports:
      - '6391:6379'
  sentinel-replica:
    image: redis:7
    profiles: [sentinel]
    command: >-
      redis-server --replicaof sentinel-master 6379
      --replica-announce-ip sentinel-replica
    ports:
      - '6392:6379'
    depends_on: [sentinel-master]
  sentinel:
    image: redis:7
    profiles: [sentinel]
    # Sentinel rewrites its config, so it needs a writable copy.
    command: >-
      sh -c 'printf "%s\n"
      "port 26379"
      "sentinel resolve-hostnames yes"
      "sentinel announce-hostnames yes"
      "sentinel monitor chanx sentinel-master 6379 1"
      "sentinel down-after-milliseconds chanx 1000"
      "sentinel failover-timeout chanx 5000"
      > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf'
    ports:
      - '26379:26379'
    depends_on: [sentinel-master, sentinel-replica]
