# Redis for the layer tests: two servers so sharding is exercised.
#   docker compose up -d
#   REDIS_URL=redis://localhost:6389 REDIS_URL_2=redis://localhost:6390 pnpm test packages/layers
services:
  redis:
    image: redis:7
    ports:
      - '6389:6379'
  redis-2:
    image: redis:7
    ports:
      - '6390:6379'
